name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show what is in the repo
        run: ls -la

      - name: Unpack project source
        run: |
          shopt -s nullglob nocaseglob
          mkdir -p unpacked
          found=0
          for z in *.zip; do
            echo "Unpacking $z"
            unzip -o "$z" -d unpacked
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "ERROR: no .zip file found in the repository root."
            exit 1
          fi
          GRADLE_FILE=$(find unpacked -name settings.gradle.kts | head -1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "ERROR: no settings.gradle.kts inside the zip."
            find unpacked -maxdepth 3 -type d
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Project root: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: night-lens-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
